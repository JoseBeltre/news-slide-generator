<!doctype html>
<!-- Imagen "A" para compartir la página pública de anuncios (1200×630, P9): crema, "Anuncios" en Instrument
     Serif, "MANSEDUMBRE II · IASD" en monoespaciada y la hoja del ícono. La captura scripts/marca.mjs, que
     inyecta las letras desde node_modules y el SVG de public/icon.svg. -->
<html lang="es-DO">
  <head>
    <meta charset="UTF-8" />
    <style>
      /* @font-face: lo añade marca.mjs */
      * { box-sizing: border-box; margin: 0; }
      body { width: 1200px; height: 630px; background: #f3f0d6; color: #1a1a1a; font-family: 'Inter Variable', sans-serif; display: flex; align-items: center; justify-content: space-between; padding: 0 96px; overflow: hidden; }
      .meta { font-family: ui-monospace, Consolas, monospace; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: #55513f; font-size: 26px; }
      h1 { font-family: 'Instrument Serif', Georgia, serif; font-weight: 400; font-size: 168px; line-height: 0.95; margin: 22px 0 26px; }
      p.lead { font-size: 32px; line-height: 1.3; color: #55513f; max-width: 640px; }
      .leaf { width: 360px; height: 360px; transform: rotate(4deg); flex-shrink: 0; }
      .leaf svg { width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <div>
      <p class="meta">Mansedumbre II · IASD</p>
      <h1>Anuncios</h1>
      <p class="lead">Lo que viene en la iglesia, siempre al día.</p>
    </div>
    <div class="leaf"><!-- icono: lo añade marca.mjs --></div>
  </body>
</html>

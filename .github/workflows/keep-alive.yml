name: keep-alive
# Supabase pausa los proyectos gratuitos tras 7 días sin actividad (SRS §8.4). Una consulta ligera
# cada 3 días lo mantiene despierto. GitHub desactiva los cron tras 60 días sin commits: si pasa,
# reactívalo en Actions → keep-alive.
on:
  schedule:
    - cron: '0 12 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Llamar a ping() en Supabase
        env:
          URL: ${{ vars.VITE_SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY || secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "::notice::Supabase no está configurado (variables de Actions); nada que mantener."
            exit 0
          fi
          curl --fail --silent --show-error --max-time 30 -X POST "$URL/rest/v1/rpc/ping" \
            -H "apikey: $KEY" -H "Content-Type: application/json" -d '{}'

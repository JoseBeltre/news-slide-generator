name: deploy
# Publica la app en https://anunciosm2.jose-web.com (§11 paso 11) al subir a master, o a mano.
on:
  push:
    branches: [master]
  workflow_dispatch:

# Nunca dos despliegues a la vez: el segundo espera a que termine el primero.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium

      # Nada se publica si algo falla: tipos, pruebas, build y E2E sin red contra el build.
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm test:e2e --project chromium

      - name: Comprobar los secretos de FTP
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          for name in FTP_HOST FTP_USERNAME FTP_PASSWORD FTP_SERVER_DIR; do
            if [ -z "${!name}" ]; then echo "::error::Falta el secreto $name (Settings → Secrets and variables → Actions)"; exit 1; fi
          done

      # dist/ ya trae el .htaccess (public/) y el Service Worker. local-dir debe terminar en '/'.
      - name: Subir a Hostinger (FTPS)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          local-dir: ./dist/
          protocol: ftps

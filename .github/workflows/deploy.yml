name: deploy
# Publica la app en https://anunciosm2.jose-web.com (§11 paso 11) al subir a master, o a mano.
on:
  push:
    branches: [master]
  workflow_dispatch:

# Nunca dos despliegues a la vez: el segundo espera a que termine el primero.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium

      # Nada se publica si algo falla: tipos, pruebas, build y E2E sin red contra el build.
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm test:e2e --project chromium

      # El build que se publica lleva la nube (§8.5). Las E2E de arriba corren sin ella, como antes.
      # Valen como variables o como secretos de Actions: son públicas por diseño (la protección está en RLS).
      - name: Build con la sincronización
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY || secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: pnpm build

      - name: Comprobar los secretos de FTP
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          for name in FTP_HOST FTP_USERNAME FTP_PASSWORD FTP_SERVER_DIR; do
            if [ -z "${!name}" ]; then echo "::error::Falta el secreto $name (Settings → Secrets and variables → Actions)"; exit 1; fi
          done

      # Migraciones de Supabase (spec P9 §6.4): la base se pone al día antes de publicar; si falla, no se sube nada.
      # CLI fijada: la 3 apunta a la base local salvo con --remote y pide --yes para cambios en la nube.
      - uses: supabase/setup-cli@v1
        with:
          version: 3.0.0
      - name: Migraciones de Supabase
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: |
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD; do
            if [ -z "${!name}" ]; then echo "::error::Falta el secreto $name (Settings → Secrets and variables → Actions)"; exit 1; fi
          done
          supabase link --project-ref "${SUPABASE_PROJECT_REF:-jyxhnqbqzqrbahorigxq}"
          supabase db push --remote --password "$SUPABASE_DB_PASSWORD" --yes
      # dist/ ya trae el .htaccess (public/) y el Service Worker. local-dir debe terminar en '/'.
      - name: Subir a Hostinger (FTPS)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          local-dir: ./dist/
          protocol: ftps
